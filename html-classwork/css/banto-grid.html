<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 150px 150px 150px;
            grid-template-rows: 150px 150px 150px;
            grid-template-areas: "item1 item2 item2"
                                "item1 item3 item4"
                                "item5 item5 item6";
            gap: 1rem;


        }
        .item{
            background-color: #501f5c;
            border: 2px solid black;
            border-radius: 2rem;
        }
        .item1{
            background-image: linear-gradient(to top,rgba(0,0,0,0.6),transparent),url(https://i.pinimg.com/originals/3d/a7/a1/3da7a11be8bc9b0d08e2098fdd3a5f29.jpg);

            background-size: cover;
            background-position: initial;
            background-repeat: no-repeat;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1" style="grid-area: item1;">1</div>
        <div class="item item2" style="grid-area: item2;">2</div>
        <div class="item item3" style="grid-area: item3;">3</div>
        <div class="item item4" style="grid-area: item4;">4</div>
        <div class="item item5" style="grid-area: item5;">5</div>
        <div class="item item6" style="grid-area: item6;">6</div>
    </div>
    
</body>
</html>
