<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <link rel="stylesheet" href="files3.css">

</head>
<body>
    <head>
        <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;

    }
    .container{
        width: 500px;
        height: 300px;
        margin-top: 50px;
        background-color:yellow;
        position: relative;
        /* position:fixed;*/
        /* position:static; */

        top: 18px;
        /* right: 0px;  */
        /* left: 150px; */
        /* right: 200px; */
        /* bottom: 500px; */
    }
    .child{
        width: 100px;
        height: 100px;
        background-color: red;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    #dis{
        display: block;
    }
    #title{
        display: none;
    }

    </style>
    </head>
   <div class="container">
    <div class="child"></div>
   </div>
   
   <span id="dis">hello</span>

   <span id="title">heading</span>

</body>
</html>
